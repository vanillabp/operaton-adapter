# VanillaBP's own names for the Operaton adapter.
#
# The code of this repository is made from the Camunda 7 adapter in two steps (see
# bin/sync-from-camunda7.sh). First Operaton's own recipe renames everything which belongs to
# the engine: packages, Maven coordinates, the getters of the model API. Then this recipe
# renames what belongs to VanillaBP: the Java package, the class names, the adapter type and
# the names in strings. Without this second step the adapter could not sit next to the
# Camunda 7 adapter in one application, and that side-by-side setup is how an application
# moves from Camunda 7 to Operaton.
#
# Every text rule is case sensitive. A rule which is not would turn 'camunda7' into
# 'Operaton' as well.
#
# The recipes run in the order they are listed. The type renames come first, because they
# name the classes by their old package. The text rules come last, because they also see
# what the Java recipes left behind.
---
type: specs.openrewrite.org/v1beta/recipe
name: io.vanillabp.operaton.FromCamunda7
displayName: VanillaBP's own names for the Operaton adapter
description: Renames the Java package, the classes, the adapter type and the names in strings of the Camunda 7 adapter.
recipeList:
  - io.vanillabp.operaton.OperatonVersion
  # One entry per class whose name contains 'Camunda7'. Do not edit the lines between the two
  # markers by hand: bin/write-type-renames.sh writes them from the sources.
  # BEGIN type renames, written by bin/write-type-renames.sh
  - org.openrewrite.java.ChangeType:
