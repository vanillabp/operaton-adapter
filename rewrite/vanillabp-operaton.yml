---
type: specs.openrewrite.org/v1beta/recipe
name: io.vanillabp.operaton.OperatonVersion
displayName: One property names the Operaton version
description: >-
  Operaton's recipe writes the version of its 1.x line, which is built for Spring Boot 3, as a
  literal into the root POM, and adds a second literal to modules which already get the version
  from dependencyManagement. This puts the version into the property 'operaton.version' and
  removes the extra literals.
recipeList:
  # The managed versions first, while the POMs are still XML: a text rule below turns a file
  # into plain text, and no XML recipe sees it afterwards. '\u0024' is the dollar sign. Written
  # as '$', the plugin would put the value of the property in, not its name.
  - org.openrewrite.xml.ChangeTagValue:
      elementName: "/project/dependencyManagement/dependencies/dependency[groupId='org.operaton.bpm']/version"
      newValue: "\u0024{operaton.version}"
  - org.openrewrite.xml.ChangeTagValue:
      elementName: "/project/dependencyManagement/dependencies/dependency[groupId='org.operaton.bpm.springboot']/version"
      newValue: "\u0024{operaton.version}"
  - org.openrewrite.xml.ChangeTagValue:
      elementName: "/project/dependencyManagement/dependencies/dependency[groupId='org.operaton.spin']/version"
      newValue: "\u0024{operaton.version}"
  # The comments of the POMs name the property, too.
  - org.openrewrite.text.FindAndReplace:
      find: camunda.version
      replace: operaton.version
      caseSensitive: true
      filePattern: '**/pom.xml'
  # The Operaton minor this adapter is built and tested with. A patch release comes through
  # Renovate on main, and main keeps it on the next sync, because this line does not change.
  # A new minor is raised here and in the root POM of main together.
  - org.openrewrite.text.FindAndReplace:
      find: '<operaton.version>[^<]*</operaton.version>'
      replace: '<operaton.version>2.2.0</operaton.version>'
      caseSensitive: true
      regex: true
      filePattern: pom.xml
  - org.openrewrite.text.FindAndReplace:
      find: '(<groupId>org\.operaton[a-z.]*</groupId>\s*<artifactId>[a-z0-9-]+</artifactId>\s*<scope>[a-z]+</scope>)\s*<version>[^<]+</version>'
      replace: '$1'
      caseSensitive: true
      regex: true
      filePattern: '*/**/pom.xml'
---
type: specs.openrewrite.org/v1beta/recipe
name: io.vanillabp.operaton.Camunda7NamesInText
displayName: The names in strings, comments and resources
description: What no Java recipe sees. Strings, comments, POMs, YAML, properties and JSON files.
recipeList:
  # The repository first, before 'camunda7' below turns it into a name nobody uses.
  - org.openrewrite.text.FindAndReplace:
      find: camunda-community-hub/vanillabp-camunda7-adapter
      replace: vanillabp/operaton-adapter
      caseSensitive: true
  # The groupId. The Camunda Community Hub owns 'org.camunda.community', and Operaton is not
  # a Camunda project.
  - org.openrewrite.text.FindAndReplace:
      find: org.camunda.community.vanillabp
      replace: io.vanillabp
      caseSensitive: true
  # Class names in strings and in resources, and the nested classes, which the type renames
  # above do not list. Also the log prefix 'Camunda7[...]' and the bean names
  # 'Camunda7_ProcessEngine_<id>'.
  - org.openrewrite.text.FindAndReplace:
      find: Camunda7
      replace: Operaton
      caseSensitive: true
  # The adapter type, the artifactIds, the engine names 'vanillabp-camunda7-<id>', the
  # Quarkus extension name and its capability 'io.vanillabp.adapter.camunda7'.
  - org.openrewrite.text.FindAndReplace:
      find: camunda7
      replace: operaton
      caseSensitive: true
  # Javadoc, comments, messages and the names of the Maven modules. A version number stays as
  # it is: 'Camunda 7.24' is a fact about Camunda. So does the name of the log a decision is
  # cited from, which the last recipe of this file writes. Without that exception a second
  # run would turn it into 'Operaton adapter's'.
  # The article goes along, so 'a Camunda 7 engine' becomes 'an Operaton engine'.
  - org.openrewrite.text.FindAndReplace:
      find: '\b([aA]) Camunda 7(?!\.\d|\d| forks?\b| family\b|\s+(?:\*|//|#)?\s*adapter''s\s+(?:\*|//|#)?\s*(?:\{@code )?DECISIONS)'
      replace: $1n Operaton
      caseSensitive: true
      regex: true
  # What is said about the forks of Camunda 7 stays about Camunda 7.
  - org.openrewrite.text.FindAndReplace:
      find: '(?<!fork of |forks of )Camunda 7(?!\.\d|\d| forks?\b| family\b|\s+(?:\*|//|#)?\s*adapter''s\s+(?:\*|//|#)?\s*(?:\{@code )?DECISIONS)'
      replace: Operaton
      caseSensitive: true
      regex: true
---
type: specs.openrewrite.org/v1beta/recipe
name: io.vanillabp.operaton.DecisionsOfTheCamunda7Adapter
displayName: The decisions the code cites are those of the Camunda 7 adapter
description: >-
  A citation 'see decision 7 in the repository's DECISIONS.md' in the generated code means
  decision 7 of the Camunda 7 adapter. This repository numbers its own decisions, so the
  citation names the log it points at.
recipeList:
  # The phrase may be wrapped over two lines of a comment, with '*', '//' or '#' in front of
  # the second line. The scripts in bin/ are left out: the self test of the citation check
  # holds such phrases as its own examples.
  - org.openrewrite.text.FindAndReplace:
      find: '([Dd]ecisions?\s+(?:\*|//|#)?\s*\d{1,3}(?:(?:,|,? and| or)\s+(?:\*|//|#)?\s*\d{1,3})*\s+(?:\*|//|#)?\s*in\s+(?:\*|//|#)?\s*the\s+(?:\*|//|#)?\s*)repository''s(?=\s+(?:\*|//|#)?\s*(?:\{@code )?DECISIONS\.md)'
      replace: $1Camunda 7 adapter's
      caseSensitive: true
      regex: true
      filePattern: '**/*.java;**/pom.xml;**/*.yaml;**/*.properties;**/*.json'
  # The same for the shorter form 'decision 7 of DECISIONS.md'.
  - org.openrewrite.text.FindAndReplace:
      find: '([Dd]ecisions?\s+(?:\*|//|#)?\s*\d{1,3}\s+(?:\*|//|#)?\s*of\s+(?:\*|//|#)?\s*)(\{@code )?DECISIONS\.md'
      replace: $1the Camunda 7 adapter's $2DECISIONS.md
      caseSensitive: true
      regex: true
      filePattern: '**/*.java;**/pom.xml;**/*.yaml;**/*.properties;**/*.json'
